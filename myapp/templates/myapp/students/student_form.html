{% extends 'myapp/base.html' %}

{% block title %}{% if form.instance.pk %}Edit{% else %}Add{% endif %} Student{% endblock %}

{% block content %}
<h3>{% if form.instance.pk %}Edit{% else %}Add New{% endif %} Student</h3>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-3">Save Student</button>
    <a href="{% url 'student_list' %}" class="btn btn-secondary mt-3">Cancel</a>
</form>
{% endblock %}
