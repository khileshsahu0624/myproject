{% extends 'myapp/auth_base.html' %}

{% block title %}Change Password | StarAdmin{% endblock %}

{% block content %}

<div class="min-vh-100 d-flex align-items-center justify-content-center" 
     style="background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);">
    
    <div class="card shadow-lg border-0" style="max-width: 460px; width: 100%; border-radius: 16px;">
        
        <div class="card-header bg-white border-0 text-center pt-4 pb-3">
            <h4 class="mb-0">Change Password</h4>
        </div>

        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} small">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                
                <button type="submit" class="btn btn-primary w-100 mt-3">Update Password</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'profile' %}" class="text-muted">Back to Profile</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
