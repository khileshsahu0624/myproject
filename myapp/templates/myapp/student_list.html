<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }

        .navbar {
            background: #4f46e5;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .table thead {
            background: #eef2ff;
        }

        .table tbody tr:hover {
            background: #f1f5f9;
            transition: 0.2s;
        }

        .btn-custom {
            border-radius: 25px;
        }

        .badge-age {
            background: #4f46e5;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 13px;
        }

        .page-title {
            font-weight: 700;
            color: #1f2937;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">
        🎓 Student Management
    </span>
</nav>

<div class="container mt-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="page-title">Student List</h3>

        <a href="/create/" class="btn btn-primary btn-custom">
            <i class="bi bi-plus-circle"></i> Add Student
        </a>
    </div>

    <!-- Card -->
    <div class="card shadow-sm p-4">

        <div class="table-responsive">
            <table class="table align-middle">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for student in students %}
                    <tr>

                        <td class="fw-semibold">
                            <i class="bi bi-person-circle me-2 text-primary"></i>
                            {{ student.name }}
                        </td>

                        <td>
                            {{ student.email }}
                        </td>

                        <td>
                            <span class="badge-age">
                                {{ student.age }}
                            </span>
                        </td>

                        <td class="text-center">

                            <a href="/update/{{ student.id }}/"
                               class="btn btn-outline-warning btn-sm btn-custom me-2">
                                Edit
                            </a>

                            <a href="/delete/{{ student.id }}/"
                               class="btn btn-outline-danger btn-sm btn-custom">
                                Delete
                            </a>

                        </td>
                    </tr>

                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">
                            No students found
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

</div>

</body>
</html>
